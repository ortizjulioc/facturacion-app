packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/engines': true
  electron: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - '@prisma/adapter-pg@7.10.1'
  - '@prisma/client-runtime-utils@7.10.1'
  - '@prisma/client@7.10.1'
  - '@prisma/config@7.10.1'
  - '@prisma/debug@7.10.1'
  - '@prisma/driver-adapter-utils@7.10.1'
  - '@prisma/engines@7.10.1'
  - '@prisma/fetch-engine@7.10.1'
  - '@prisma/get-platform@7.10.1'
  - eslint-config-next@16.4.2
  - next@16.4.2
  - prisma@7.10.1
  - electron@45.0.0
  - vite@8.3.5
