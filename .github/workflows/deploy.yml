name: Deploy

# Construye imágenes linux/arm64 (el servidor Oracle es Ampere), las sube a GHCR
# y avisa a Dokploy para que redespliegue.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/facturacion

jobs:
  images:
    # Runner ARM nativo: evita emular con QEMU (mucho más rápido).
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  redeploy:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      # Un webhook por aplicación de Dokploy (Settings → Deployments → Webhook URL).
      - name: Redeploy api
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_API }}"
      - name: Redeploy web
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_WEB }}"
