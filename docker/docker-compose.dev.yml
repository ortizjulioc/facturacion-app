# Servicios de apoyo para desarrollo local (opcional si ya tienes Postgres instalado):
#   docker compose -f docker/docker-compose.dev.yml up -d
name: facturacion-dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facturacion
    ports:
      - "5433:5432" # 5433 para no chocar con un Postgres local en 5432
    volumes:
      - pgdata:/var/lib/postgresql

  # Simula OCI Object Storage (API compatible con S3).
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
